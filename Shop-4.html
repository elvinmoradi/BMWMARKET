<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMWMarket 🛒 | فروش سکه Animal Rush</title>
<link rel="icon" type="image/png" id="faviconLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#07070a;--bg-1:#0d0e13;--bg-2:#14151c;--bg-3:#1b1c26;
  --gold:#d4af37;--gold-bright:#f2cd5c;--gold-dim:#8a7328;
  --white:#f5f5f7;--muted:#9a9aa5;--muted-2:#6c6c78;
  --green:#2ecc71;--red:#e74c3c;--blue:#4aa3e8;--orange:#e8a33d;
  --border:rgba(212,175,55,.16);--border-soft:rgba(255,255,255,.07);
  --glass-bg:rgba(20,21,28,.55);--radius:16px;--radius-sm:10px;
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);--shadow-gold:0 8px 30px rgba(212,175,55,.18);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;font-optical-sizing:auto;
  background:radial-gradient(circle at 15% 0%,rgba(212,175,55,.08),transparent 40%),
             radial-gradient(circle at 85% 20%,rgba(212,175,55,.05),transparent 35%),var(--bg-0);
  color:var(--white);min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
.site-header{position:sticky;top:0;z-index:100;background:rgba(10,10,14,.75);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft)}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent;letter-spacing:.3px}
.brand .emoji{-webkit-text-fill-color:initial}
.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(212,175,55,.4),0 4px 14px rgba(212,175,55,.25)}
.brand-logo-lg{width:110px;height:110px;border-radius:50%;object-fit:cover;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(212,175,55,.5),0 10px 30px rgba(212,175,55,.3);margin:0 auto 18px}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.nav-links a{padding:9px 14px;border-radius:999px;color:var(--muted);font-size:.92rem;font-weight:600;transition:all .25s var(--ease)}
.nav-links a:hover,.nav-links a.active{color:var(--bg-0);background:var(--gold)}
.header-actions{display:flex;align-items:center;gap:10px}
.hamburger{display:none;width:42px;height:42px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-2);color:var(--white);align-items:center;justify-content:center;font-size:1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;
  border:none;font-weight:700;font-size:.95rem;transition:transform .2s var(--ease),box-shadow .2s var(--ease),
  background .2s var(--ease),opacity .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#16130a;box-shadow:var(--shadow-gold)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(212,175,55,.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--white)}
.btn-outline:hover{background:var(--bg-3);border-color:var(--gold-dim)}
.btn-ghost{background:var(--bg-2);color:var(--muted);border:1px solid var(--border-soft)}
.btn-ghost:hover{color:var(--white)}
.btn-danger{background:rgba(231,76,60,.14);color:#ff8a7a;border:1px solid rgba(231,76,60,.3)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:.85rem}
.card{background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow-lg)}
.hero{padding:90px 0 70px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-20% -10% auto -10%;height:500px;
  background:radial-gradient(ellipse at center,rgba(212,175,55,.14),transparent 65%);pointer-events:none}
.hero h1{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:800;line-height:1.3;margin:0 0 18px}
.hero h1 .accent{background:linear-gradient(90deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:1.1rem;margin:0 0 34px}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:10px 0 70px}
.feature-card{padding:26px 20px;text-align:center;transition:transform .3s var(--ease),border-color .3s}
.feature-card:hover{transform:translateY(-6px);border-color:var(--border)}
.feature-card .icon{font-size:2rem;margin-bottom:12px}
.feature-card h3{font-size:1rem;margin:0 0 8px}
.feature-card p{color:var(--muted-2);font-size:.85rem;margin:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px}
.section-title h2{font-size:1.5rem;margin:0}
.section-title p{color:var(--muted-2);margin:4px 0 0;font-size:.9rem}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding-bottom:60px}
.product-card{overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),
  box-shadow .3s var(--ease),border-color .3s;cursor:pointer}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-gold);border-color:var(--border)}
.product-thumb{height:110px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(212,175,55,.14),rgba(212,175,55,.02) 60%),
  linear-gradient(160deg,var(--bg-3),var(--bg-1));position:relative;overflow:hidden;
  border-bottom:1px solid var(--border-soft)}
.badge{position:absolute;top:12px;left:12px;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(46,204,113,.16);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.badge.out{background:rgba(231,76,60,.16);color:#ff8a7a;border-color:rgba(231,76,60,.3)}
.badge-featured{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(212,175,55,.18);color:var(--gold-bright);border:1px solid rgba(212,175,55,.4)}
.product-info{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.product-info h3{margin:0;font-size:1.05rem}
.product-info .desc{color:var(--muted-2);font-size:.82rem;margin:0;line-height:1.6;min-height:40px}
.product-price{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;
  border-top:1px dashed var(--border-soft)}
.price-value{font-size:1.15rem;font-weight:800;color:var(--gold-bright)}
.price-value small{font-size:.7rem;color:var(--muted-2);font-weight:500}
.form-group{margin-bottom:18px;text-align:right}
.form-group label{display:block;margin-bottom:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.form-control{width:100%;padding:13px 16px;background:var(--bg-2);border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);color:var(--white);font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.form-control:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.form-control::placeholder{color:var(--muted-2)}
.form-hint{font-size:.78rem;color:var(--muted-2);margin-top:6px}
.form-error{font-size:.82rem;color:#ff8a7a;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.25);
  padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;display:none}
.form-error.show{display:block}
.auth-shell{max-width:460px;margin:60px auto;padding:34px}
.auth-shell h1{text-align:center;font-size:1.4rem;margin-bottom:4px}
.auth-shell .sub{text-align:center;color:var(--muted-2);font-size:.85rem;margin-bottom:26px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.82rem;font-weight:700}
.status-pending_payment{background:rgba(232,163,61,.14);color:var(--orange)}
.status-payment_confirmed{background:rgba(74,163,232,.14);color:var(--blue)}
.status-processing{background:rgba(232,163,61,.14);color:var(--orange)}
.status-completed{background:rgba(46,204,113,.14);color:var(--green)}
.status-cancelled{background:rgba(231,76,60,.14);color:#ff8a7a}
.timeline{list-style:none;margin:26px 0 0;padding:0;position:relative}
.timeline li{position:relative;padding-right:34px;padding-bottom:26px}
.timeline li::before{content:'';position:absolute;right:6px;top:2px;width:12px;height:12px;border-radius:50%;
  background:var(--bg-3);border:2px solid var(--muted-2)}
.timeline li::after{content:'';position:absolute;right:11px;top:16px;bottom:0;width:2px;background:var(--border-soft)}
.timeline li:last-child::after{display:none}
.timeline li.done::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15)}
.timeline li .t-label{font-weight:700;font-size:.95rem}
.timeline li .t-time{font-size:.78rem;color:var(--muted-2);margin-top:3px}
.flex{display:flex}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.text-muted{color:var(--muted-2)}
.text-center{text-align:center}
.hidden{display:none!important}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-soft);border-top-color:var(--gold);
  animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted-2)}
.empty-state .icon{font-size:2.6rem;margin-bottom:14px}
.site-footer{border-top:1px solid var(--border-soft);padding:40px 0;margin-top:60px;color:var(--muted-2);
  font-size:.85rem;text-align:center}
#toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;
  flex-direction:column;gap:10px;width:min(92vw,380px)}
.toast{padding:14px 18px;border-radius:var(--radius-sm);background:var(--bg-3);border:1px solid var(--border);
  box-shadow:var(--shadow-lg);font-size:.88rem;animation:toast-in .25s var(--ease)}
.toast.success{border-color:rgba(46,204,113,.4)}
.toast.error{border-color:rgba(231,76,60,.4)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card-pay-box{padding:22px;border:1px dashed var(--gold-dim);border-radius:var(--radius-sm);background:rgba(212,175,55,.05);text-align:center}
.card-number{font-size:1.5rem;font-weight:800;letter-spacing:2px;color:var(--gold-bright);direction:ltr;margin:10px 0;font-family:monospace}
.flash-banner{background:linear-gradient(90deg,rgba(212,175,55,.16),rgba(212,175,55,.04));border:1px solid rgba(212,175,55,.3);
  border-radius:var(--radius-sm);padding:16px 22px;margin:16px auto 0;max-width:900px;text-align:center}
.flash-banner .txt{font-weight:700;color:var(--gold-bright);margin-bottom:8px}
.countdown{display:flex;justify-content:center;gap:10px;font-family:monospace;direction:ltr}
.countdown span{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;padding:6px 12px;font-weight:800;min-width:50px}
.stats-bar{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;padding:18px 0;color:var(--muted);font-size:.85rem}
.stats-bar b{color:var(--gold-bright);font-weight:800}
.testimonial-card{padding:20px}
.testimonial-card .stars{color:var(--gold-bright);margin-bottom:8px;font-size:.9rem}
.testimonial-card p{margin:0 0 12px;font-size:.88rem;color:var(--muted);line-height:1.8}
.testimonial-card .author{font-size:.8rem;font-weight:700}
.tier-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700}
.tier-bronze{background:rgba(205,127,50,.15);color:#e0975c}
.tier-silver{background:rgba(192,192,192,.15);color:#cfcfcf}
.tier-gold{background:rgba(212,175,55,.18);color:var(--gold-bright)}
.discount-applied{color:var(--green);font-weight:700;font-size:.85rem}
.price-strike{text-decoration:line-through;color:var(--muted-2);font-size:.85rem;margin-left:8px}
@media (max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .nav-links{display:none;position:absolute;top:68px;right:0;left:0;flex-direction:column;
    background:rgba(10,10,14,.98);backdrop-filter:blur(14px);padding:14px;border-bottom:1px solid var(--border-soft);gap:4px}
  .nav-links.open{display:flex}
  .nav-links a{width:100%;text-align:center}
  .hamburger{display:flex}
  .hero{padding:60px 0 40px}
  .auth-shell{margin:30px auto;padding:24px}
}
@media (max-width:560px){
  .features{grid-template-columns:1fr}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .product-info{padding:12px}
}
</style>
</head>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABELS = {
  pending_payment: '🟡 در انتظار تایید پرداخت',
  payment_confirmed: '🔵 پرداخت تأیید شد',
  processing: '🟠 در حال پردازش',
  completed: '🟢 تحویل شد',
  cancelled: '🔴 لغو شد',
};
const STATUS_ORDER = ['pending_payment','payment_confirmed','processing','completed'];

function formatToman(n){ return new Intl.NumberFormat('fa-IR').format(n) + ' تومان'; }
function formatNumber(n){ return new Intl.NumberFormat('fa-IR').format(n); }
function formatDate(ts){
  if(!ts) return '-';
  try{ return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(ts)); }
  catch(e){ return '-'; }
}
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function toast(msg, type='success'){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>el.remove(), 4500);
}
function genOrderCode(){ return 'BMW-' + Math.floor(10000 + Math.random()*89999); }
function qs(name){ return new URLSearchParams(window.location.search).get(name); }

function navigate(hash){ window.location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function currentRoute(){
  const h = window.location.hash.replace(/^#\/?/, '');
  return h ? h.split('/') : [''];
}

async function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  const page = route[0] || 'home';

  app.innerHTML = `${headerHtml(page)}<div id="pageBody"></div>${footerHtml()}`;
  bindHeader();
  const body = document.getElementById('pageBody');

  switch(page){
    case '': case 'home': await renderHome(body); break;
    case 'shop': await renderShop(body); break;
    case 'product': await renderProduct(body, route[1]); break;
    case 'checkout': await renderCheckout(body, route[1]); break;
    case 'track': await renderTrack(body, route[1]); break;
    case 'support': renderSupport(body); break;
    default: await renderHome(body);
  }
}

function headerHtml(active){
  return `
  <header class="site-header">
    <div class="container flex-between">
      <a href="#/home" class="brand"><img src="${LOGO_DATA_URL}" class="brand-logo" alt="BMWMarket"> BMWMarket</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#/home" class="${active==='home'?'active':''}">خانه</a></li>
        <li><a href="#/shop" class="${active==='shop'?'active':''}">فروشگاه</a></li>
        <li><a href="#/track" class="${active==='track'?'active':''}">پیگیری سفارش</a></li>

      ${promo.ends_at ? `<div class="countdown" id="flashCountdown" data-ends="${promo.ends_at}"><span id="cd-d">00</span>:<span id="cd-h">00</span>:<span id="cd-m">00</span>:<span id="cd-s">00</span></div>` : ''}
    </div>`;
}

function startCountdown(){
  const el = document.getElementById('flashCountdown');
  if(!el) return;
  const endsAt = new Date(el.dataset.ends).getTime();
  function tick(){
    const now = Date.now();
    let diff = Math.max(0, endsAt - now);
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000); diff -= h*3600000;
    const m = Math.floor(diff/60000); diff -= m*60000;
    const s = Math.floor(diff/1000);
    const pad = n => String(n).padStart(2,'0');
    if(document.getElementById('cd-d')) document.getElementById('cd-d').textContent = pad(d);
    if(document.getElementById('cd-h')) document.getElementById('cd-h').textContent = pad(h);
    if(document.getElementById('cd-m')) document.getElementById('cd-m').textContent = pad(m);
    if(document.getElementById('cd-s')) document.getElementById('cd-s').textContent = pad(s);
  }
  tick();
  const timer = setInterval(()=>{
    if(!document.getElementById('flashCountdown')){ clearInterval(timer); return; }
    tick();
  }, 1000);
}

        finalPercent = promo.discount_percent;
      }
      const finalPrice = finalPercent ? Math.round(freshProduct.price * (100-finalPercent)/100) : freshProduct.price;

      const orderCode = genOrderCode();
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const path = `${orderCode}-${Date.now()}.${ext}`;

      const { error: uploadErr } = await sb.storage.from('receipts').upload(path, file, { upsert: false });

      const { data: urlData } = sb.storage.from('receipts').getPublicUrl(path);
      const receiptUrl = urlData.publicUrl;

      btn.textContent = 'در حال ثبت سفارش...';
      const nowIso = new Date().toISOString();
      const { error: insertErr } = await sb.from('orders').insert({
        order_code: orderCode,
        product_id: freshProduct.id,
        product_name: freshProduct.name,
        coin_amount: freshProduct.coin_amount,
        total_price: finalPrice,
        discount_percent: finalPercent,
        discount_code: finalCode,
        referral_code: refFromUrl || null,
        game_account_id: gameAccountId,
        contact_phone: contactPhone,
        receipt_url: receiptUrl,
        status: 'pending_payment',
        history: [{ status: 'pending_payment', changed_at: nowIso, changed_by: 'system' }],
      });
      if(insertErr) throw insertErr;

      toast('سفارش با موفقیت ثبت شد!');
      navigate('#/track/' + orderCode);
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = 'ثبت نهایی سفارش';
    }
  });

async function renderTrack(body, presetCode){
  body.innerHTML = `
    <div class="container" style="padding-top:40px; max-width:640px;">
      <div class="card" style="padding:28px;">
        <h1 style="margin-top:0;">پیگیری سفارش</h1>
        <p class="text-muted">بدون نیاز به ورود، کد سفارش خود را وارد کنید.</p>
        <form id="trackForm" class="flex gap-8" style="align-items:flex-start;">
          <input class="form-control" id="orderCodeInput" placeholder="مثلاً BMW-48291" value="${presetCode?esc(presetCode):''}" required>
          <button class="btn btn-primary" type="submit">جستجو</button>
        </form>
      </div>
      <div id="trackResult" class="mt-24"></div>
    </div>`;

  document.getElementById('trackForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const code = document.getElementById('orderCodeInput').value.trim().toUpperCase();
    if(code) doTrack(code);
  });
  if(presetCode) doTrack(presetCode.toUpperCase());
}

async function doTrack(code){
  const box = document.getElementById('trackResult');
  box.innerHTML = '<div class="spinner"></div>';
  try{
    const { data, error } = await sb.rpc('track_order', { p_code: code });
    if(error) throw error;
    if(!data || !data.length){ box.innerHTML = `<div class="empty-state card"><div class="icon">🔍</div><p>سفارشی با این کد یافت نشد.</p></div>`; return; }
    const order = data[0];
    const isCancelled = order.status === 'cancelled';
    const currentIndex = STATUS_ORDER.indexOf(order.status);
    const history = order.history || [];

    const timelineHtml = isCancelled
      ? `<li class="done"><span class="t-label">🔴 سفارش لغو شد</span><div class="t-time">${formatDate(order.updated_at)}</div></li>`
      : STATUS_ORDER.map((s,i)=>{
          const entry = history.find(h=>h.status===s);
          const done = i <= currentIndex;
          return `<li class="${done?'done':''}"><span class="t-label">${STATUS_LABELS[s]}</span><div class="t-time">${entry?formatDate(entry.changed_at):'در انتظار'}</div></li>`;
        }).join('');

    box.innerHTML = `
      <div class="card" style="padding:26px;">
        <div class="flex-between mb-16">
          <div><div class="text-muted" style="font-size:.8rem;">کد سفارش</div><div style="font-size:1.2rem; font-weight:800;">${order.order_code}</div></div>
          <span class="status-pill status-${order.status}">${STATUS_LABELS[order.status]}</span>
        </div>
        <div class="flex gap-16 mt-16" style="flex-wrap:wrap; align-items:center;">
          <div><span class="text-muted">مقدار سکه: </span><b>${formatNumber(order.coin_amount)} 🪙</b></div>
          <div><span class="text-muted">مبلغ: </span><b>${formatToman(order.total_price)}</b></div>
          ${order.discount_percent ? `<div class="discount-applied">${order.discount_percent}٪ تخفیف اعمال شد</div>` : ''}
          ${order.receipt_url ? '<div><span class="text-muted">فیش واریزی: </span><b style="color:var(--green);">✅ دریافت شد</b></div>' : ''}
          <div id="tierBadgeBox"></div>
        </div>
        <ul class="timeline mt-24">${timelineHtml}</ul>
      </div>`;

    if(order.status === 'completed'){
      try{
        const { data: tier } = await sb.rpc('get_customer_tier', { p_phone: order.contact_phone });
        const tierMap = { bronze: { label: '🥉 مشتری برنزی', cls: 'tier-bronze' }, silver: { label: '🥈 مشتری نقره‌ای', cls: 'tier-silver' }, gold: { label: '🥇 مشتری طلایی', cls: 'tier-gold' } };
        const t = tierMap[tier] || tierMap.bronze;
        const el = document.getElementById('tierBadgeBox');
        if(el) el.innerHTML = `<span class="tier-badge ${t.cls}">${t.label}</span>`;
      }catch(e){ /* ignore */ }
    }
  }catch(err){
    box.innerHTML = `<div class="empty-state card"><div class="icon">⚠️</div><p>${esc(err.message)}</p></div>`;
  }
}
